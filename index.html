<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8effa">
<meta name="description" content="Artiist Duo — thoughtful gifts, press-on nails, makeup, crochet and flowers.">
<title>Artiist Duo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style id="shopStyles">
:root{--bg:#fffafc;--surface:#fff;--tx:#2c202f;--mu:#786a7a;--bd:#eedfee;--ac:#a259d9;--rose:#f7dcea;--lav:#ead3f4;--dark:#231829;--max:1240px;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 'DM Sans',Arial,sans-serif;overflow-x:hidden}
body.drawer-open,body.menu-open{overflow:hidden}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;letter-spacing:-.035em;line-height:1.12}
em{font-style:italic;font-weight:400}
a{text-decoration:none;color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.announcement{text-align:center;background:#e8ccf2;color:#403147;letter-spacing:.15em;font-size:10px;font-weight:700;padding:8px 12px;text-transform:uppercase}
.site-header{height:86px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(20px,4vw,65px);background:#fffcff;position:sticky;top:0;z-index:12;border-bottom:1px solid #f4eaf3}
.header-left,.header-actions{display:flex;align-items:center;gap:12px}
.header-actions{justify-content:flex-end}
.icon-btn{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center;position:relative;color:var(--dark);border-radius:50%}
.icon-btn:hover{background:#f5eaf7}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.active svg{fill:#f7dcf1;color:#8f4ca2}
.count{position:absolute;right:0;top:0;min-width:16px;height:16px;display:none;place-items:center;background:var(--ac);color:white;border-radius:100px;font-size:10px;font-weight:700;line-height:1}
.brand-lockup{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
.brand-lockup img{height:50px;width:50px;border-radius:50%;object-fit:cover}
.brand-name{font-family:'Playfair Display',Georgia,serif;font-size:32px;line-height:1;font-weight:600;letter-spacing:-.06em;white-space:nowrap}
.brand-name span{color:#b98bd0;font-family:'DM Sans',sans-serif;font-size:.65em;font-weight:400;margin-left:3px}
.desktop-nav{display:flex;gap:20px;padding-left:14px;font-size:12px;font-weight:700;letter-spacing:.07em}
.desktop-nav a:hover{color:#9557ad}
.search-panel{display:none;background:#fffaff;border-bottom:1px solid var(--bd);position:sticky;top:86px;z-index:11;padding:14px clamp(18px,5vw,100px);box-shadow:0 15px 26px #26182c0b}
.search-panel.visible{display:block}
.search-panel input{height:46px;border:1px solid #e8d7eb;border-radius:3px;padding:0 16px;width:100%;max-width:960px;display:block;margin:0 auto;background:#fff}
.shell{max-width:var(--max);margin-left:auto;margin-right:auto;padding-left:clamp(20px,4vw,54px);padding-right:clamp(20px,4vw,54px)}
.hero{max-width:1600px;margin:0 auto;background:#e7bbf0;min-height:545px;display:grid;grid-template-columns:53% 47%;position:relative;isolation:isolate;overflow:hidden}
.hero::before{content:"";width:720px;height:720px;border:1px solid #ffffff80;position:absolute;border-radius:50%;left:-210px;top:-200px;pointer-events:none}
.hero-copy{padding:clamp(70px,8vw,132px) 30px 68px clamp(38px,8vw,133px);position:relative;z-index:2}
.hero-overline{font-size:10px;letter-spacing:.24em;font-weight:700;color:#67446a;margin-bottom:18px}
.hero h1{font-size:clamp(52px,6.1vw,97px);letter-spacing:-.057em;margin-bottom:23px;color:#fff;text-shadow:0 1px 1px #78578815}
.hero h1 em{color:#fff}
.hero-copy p{font-size:15px;line-height:1.8;margin-bottom:32px;max-width:400px;color:#4f3456}
.dark-btn{border:1px solid var(--dark);color:#fff;background:var(--dark);padding:14px 21px;display:inline-flex;align-items:center;justify-content:center;gap:24px;font:700 11px/1.25 'DM Sans',sans-serif;letter-spacing:.07em;min-height:45px;border-radius:0;white-space:nowrap}
.dark-btn:hover{background:#54365a;border-color:#54365a}
.hero-art{position:relative;display:flex;align-items:center;justify-content:center;min-height:510px}
.hero-circle{height:min(33vw,400px);width:min(33vw,400px);min-height:320px;min-width:320px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff,#fffbff 70%);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 22px 65px #af76bb37;position:relative;z-index:2;transform:rotate(-6deg)}
.hero-circle img{width:145px;height:145px;object-fit:contain;filter:drop-shadow(0 8px 8px #42304a24);border-radius:50%}
.little-stars{position:absolute;top:65px;color:#cf8cd1;font-size:32px;letter-spacing:.8em}
.circle-caption{font:italic 20px 'Playfair Display',Georgia,serif;color:#a76caa;padding-top:18px}
.orbit{position:absolute;border:1px solid #fff9;border-radius:50%;height:550px;width:550px;top:-65px;right:-30px}
.orbit-two{height:460px;width:460px;top:-25px;right:15px;opacity:.5}
.hero-sticker{position:absolute;z-index:3;display:grid;place-items:center;background:#fff9fe;box-shadow:0 8px 20px #ad80b337;border-radius:22px;transform:rotate(-13deg)}
.sticker-flower{width:99px;height:99px;top:50px;left:0;color:#c67cc7;font-size:70px}
.sticker-bow{width:100px;height:95px;right:6%;top:55px;font-size:52px;transform:rotate(12deg)}
.sticker-gift{width:100px;height:100px;bottom:50px;left:0;font-size:55px;transform:rotate(11deg)}
.sticker-sparkle{right:7%;bottom:68px;background:#fff0;box-shadow:none;color:#fff;font-size:70px}
.ticker{background:#241b28;color:#fff;overflow:hidden;padding:19px 0}
.ticker-track{width:max-content;display:flex;gap:32px;align-items:center;animation:slide 35s linear infinite}
.ticker span{font:400 19px/1.2 'Playfair Display',Georgia,serif;white-space:nowrap;letter-spacing:-.025em}
.ticker span em{font-style:italic}
.ticker b{font-size:16px;color:#ead2f1;font-weight:400}
@keyframes slide{to{transform:translateX(-50%)}}
.collections{padding-top:86px;padding-bottom:104px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:32px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.23em;color:#a268aa;margin-bottom:13px}
.section-head h2,.story-copy h2,.bottom-callout h2{font-size:clamp(38px,4vw,57px);margin:0}
.section-head em,.story-copy em,.bottom-callout em{color:#a86db5}
.text-link{font-size:10px;letter-spacing:.15em;font-weight:700;color:#9453a1;white-space:nowrap;display:inline-block;padding:12px 0;background:none;border:0}
.text-link:hover{text-decoration:underline}
.collection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.collection-card{background:#f7e1ef;display:flex;flex-direction:column;overflow:hidden;transition:transform .2s,box-shadow .2s;border-radius:3px}
.collection-card:hover{transform:translateY(-4px);box-shadow:0 10px 35px #5033591c}
.collection-photo{height:244px;position:relative;overflow:hidden;display:grid;place-items:center}
.collection-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.collection-card:hover .collection-photo img{transform:scale(1.04)}
.collection-photo.rose{background:linear-gradient(125deg,#f6c9d9,#fce9e6)}
.collection-photo.lilac{background:linear-gradient(130deg,#e0c4f4,#f6daed)}
.collection-photo.peach{background:linear-gradient(135deg,#f8d6bd,#fff1db)}
.collection-photo.pink{background:linear-gradient(130deg,#f6bcd9,#ffe8f3)}
.collection-photo.butter{background:linear-gradient(130deg,#f9e7bf,#fff6e6)}
.collection-photo.mint{background:linear-gradient(140deg,#c9e5d3,#f9edee)}
.collection-illustration{position:relative;display:grid;place-items:center;width:100%;height:100%}
.illus-ring{width:195px;height:195px;background:#fff9;border-radius:50%;position:absolute;box-shadow:0 12px 22px #55415d12}
.illus-ring::before,.illus-ring::after{content:"✧";position:absolute;color:#c481c2;font-size:31px;left:-16px;top:40px}
.illus-ring::after{left:auto;right:-15px;top:120px}
.illus-emoji{font-size:87px;position:relative;filter:drop-shadow(3px 8px 5px #58405d22);transform:rotate(-8deg)}
.illus-star{font-size:47px;color:#fff;position:absolute;right:14%;top:11%}
.collection-info{min-height:160px;position:relative;padding:24px 26px 40px;flex:1}
.collection-info h3{font-size:28px;line-height:1.15;margin-bottom:10px}
.collection-info p{color:#785d73;font-size:12px;line-height:1.45;margin-bottom:0}
.collection-arrow{position:absolute;right:22px;bottom:18px;font-size:19px;font-family:'DM Sans',sans-serif}
.story-band{max-width:1600px;min-height:460px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;background:#f2e2f0}
.story-art{background:radial-gradient(circle at 50% 50%,#fefafd 0 26%,transparent 26%),linear-gradient(140deg,#ddbbef,#f4d8e6);display:grid;place-items:center;position:relative;overflow:hidden;min-height:380px}
.story-art::before{content:"";border:1px solid #fff9;border-radius:50%;width:510px;height:510px;position:absolute}
.story-art span{font:italic 45px/.92 'Playfair Display',Georgia,serif;color:#b37cba;transform:rotate(-7deg);text-align:center;position:relative}
.story-outline{position:absolute;top:15px;left:15%;font:140px Georgia,serif;color:#fff9;transform:rotate(-15deg)}
.story-flower{position:absolute;bottom:0;right:13%;font:150px Georgia,serif;color:#fff9}
.story-copy{display:flex;flex-direction:column;justify-content:center;align-items:start;padding:60px clamp(30px,8vw,125px)}
.story-copy p{color:#756375;line-height:1.85;max-width:385px;margin:22px 0}
.products-section{padding-top:92px;padding-bottom:92px}
.section-note{font:italic 18px 'Playfair Display',Georgia,serif;color:#9a7e97}
.chips{display:flex;gap:9px;overflow:auto;padding:3px 0 24px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:#fff;border:1px solid #eadbea;border-radius:999px;padding:10px 18px;font-size:11px;font-weight:600;white-space:nowrap}
.chip:hover,.chip.on{background:#4a2e4f;border-color:#4a2e4f;color:white}
.products-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:21px}
.product-card{position:relative;cursor:pointer;min-width:0}
.product-image{height:270px;display:grid;place-items:center;background:#f2e3f2;overflow:hidden}
.product-image img{height:100%;width:100%;object-fit:cover;transition:transform .3s}
.product-card:hover .product-image img{transform:scale(1.04)}
.product-image>span{font-size:90px;color:#d8a9db}
.product-body{padding:18px 0}
.product-cat{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#ad87ab;margin-bottom:7px}
.product-body h3{font-size:22px;line-height:1.25;margin:0 0 9px}
.product-price{font-size:13px;color:#402b45;font-weight:700}
.product-price s{color:#988497;margin-left:8px;font-weight:400}
.heart-toggle{position:absolute;right:12px;top:12px;z-index:2;border:0;background:#fffefa;width:34px;height:34px;border-radius:50%;font-size:22px;display:grid;place-items:center;box-shadow:0 2px 7px #0001;color:#5d435e}
.heart-toggle.is-liked{color:#b64c98}
.off{position:absolute;top:13px;left:12px;z-index:2;background:#a24a94;color:white;font-size:10px;padding:6px 9px;letter-spacing:.04em}
.add-button{background:#fff;border:1px solid #35253a;color:#33243a;width:100%;padding:12px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;margin-top:17px}
.add-button:hover{background:#35253a;color:#fff}
.empty-state{text-align:center;border:1px solid #f3e4f0;padding:44px 20px;margin:6px 0 30px;background:#fff}
.empty-state div,.cart-empty div{font:72px 'Playfair Display',Georgia,serif;color:#cba5d2;line-height:1}
.empty-state h3,.cart-empty h3{font-size:27px;margin:15px 0 6px}
.empty-state p{color:#877487;font-size:13px;max-width:460px;margin:0 auto 18px}
.empty-state a{font-size:12px;font-weight:700;color:#a367ae;text-decoration:underline}
.bottom-callout{text-align:center;background:#e8c9ee;padding:70px 20px 78px}
.bottom-callout h2{margin:0}
.bottom-callout p{margin:18px auto 25px;max-width:380px;color:#654d67;font-size:14px}
.site-footer{background:#231b27;color:#e7d7e5;padding:64px clamp(24px,6vw,90px) 25px}
.footer-inner{max-width:var(--max);margin:auto;display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:40px}
.footer-name{font:600 33px 'Playfair Display',Georgia,serif;color:white;letter-spacing:-.04em;margin:0 0 10px}
.footer-inner p{font-size:12px;line-height:1.9;max-width:315px;color:#bcaabe}
.footer-label{font-size:11px;font-weight:700;letter-spacing:.13em;color:white;margin-bottom:18px}
.footer-links{display:flex;flex-direction:column;gap:10px;font-size:12px}
.footer-links a:hover{color:#fff}
.footer-bottom{max-width:var(--max);margin:50px auto 0;border-top:1px solid #4c3a51;padding-top:20px;font-size:11px;color:#aa96ac;display:flex;justify-content:space-between;gap:18px}
#pageOverlay,#menuOverlay{display:none;position:fixed;inset:0;background:#23172999;z-index:20}
#pageOverlay.shown,#menuOverlay.shown{display:block}
.cart{position:fixed;right:0;top:0;bottom:0;width:min(450px,100%);background:#fffaff;z-index:25;padding:30px 30px 50px;overflow-y:auto;transform:translateX(103%);transition:transform .3s;box-shadow:-14px 0 45px #2c172a22}
.cart.open{transform:translateX(0)}
.cart-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--bd);padding-bottom:23px;margin-bottom:24px}
.cart-head h2{font-size:34px;margin:0}
.cart-head h2 em{color:#b980c4}
.cart-empty{text-align:center;padding:90px 18px}
.cart-empty p{font-size:13px;color:#8a798b;margin-bottom:22px}
.cart-line{display:flex;gap:15px;border-bottom:1px solid #f0e2f1;padding-bottom:18px;margin-bottom:20px}
.cart-line img,.cart-img-placeholder{width:88px;height:95px;object-fit:cover;background:#f4e3f2}
.cart-img-placeholder{display:grid;place-items:center;font-size:40px}
.cart-line-info{display:flex;align-items:flex-start;flex-direction:column;gap:3px;flex:1}
.cart-line-info b{font:500 20px 'Playfair Display',Georgia,serif}
.cart-line-info>span{font-size:13px;color:#604c61}
.quantity{margin-top:5px;display:flex;align-items:center;gap:12px;border:1px solid var(--bd)}
.quantity button{width:28px;height:27px;border:0;background:transparent}
.quantity span{font-size:13px}
.cart-total{display:flex;justify-content:space-between;font-size:16px;margin:24px 0 5px}
.cart-delivery{background:#f4e5f3;padding:12px 13px;color:#725e73;font-size:12px;margin:17px 0 23px}
label{display:block;font-size:12px;font-weight:600;margin:15px 0 6px}
input:not([type='checkbox']),textarea,select{width:100%;padding:12px 14px;background:white;border:1px solid #e7d6e9;border-radius:2px;color:var(--tx)}
.cart label{margin:12px 0 5px}
.checkout-button{width:100%;margin-top:15px}
.menu-drawer{position:fixed;left:0;top:0;bottom:0;width:min(350px,88vw);z-index:24;background:#fffaff;transform:translateX(-105%);transition:transform .3s;padding:28px;box-shadow:10px 0 45px #2b1e2b29}
.menu-drawer.open{transform:translateX(0)}
.menu-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);padding-bottom:14px}
.menu-top h2{font-size:29px;margin:0}
.menu-links{display:flex;flex-direction:column;margin-top:25px}
.menu-links a,.menu-links button{border:0;border-bottom:1px solid #f0e5f0;background:none;padding:17px 5px;text-align:left;font:500 22px 'Playfair Display',Georgia,serif}
.menu-links .admin-entry{display:flex;align-items:center;gap:12px;margin-top:16px;border-top:1px solid #e5d1e8;padding-top:22px;color:#75428c;font-weight:600}
.menu-links .admin-entry:hover{color:#a259d9}
.menu-links .admin-entry svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-note{color:#8c788e;font-size:12px;margin-top:30px;line-height:2}
.order-success{padding:15px;text-align:center;background:#e7f3e7;color:#304b35;font-size:13px}
.connection-note{text-align:center;background:#fff2ee;color:#8a5c50;font-size:12px;padding:10px}
/* Product detail and existing admin functionality */
#app>.detail,#app>.panel,#app>.tabs,#app>.sans,#app>h2,#app>.row,#app>.mu,#app>p:not([class]){max-width:var(--max);margin-left:auto;margin-right:auto;padding-left:clamp(20px,4vw,54px);padding-right:clamp(20px,4vw,54px)}
#app>.detail{padding-top:48px;padding-bottom:80px}
.detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:45px}
.detail .im2{aspect-ratio:1;background:#f4e2f1;display:grid;place-items:center;font-size:120px;overflow:hidden}
.detail .im2 img{width:100%;height:100%;object-fit:cover}
.detail h2{font-size:43px;margin-top:15px}
.detail .pr{font-size:25px;color:var(--ac);font-weight:700}
.detail .old{font-size:15px;color:#918494;text-decoration:line-through;margin-left:9px}
.badge{display:inline-block;font-size:11px;padding:5px 10px;background:#f1e4f1;border-radius:99px}
.mu{font-size:13px;color:var(--mu)}
.sans{font-family:'DM Sans',Arial,sans-serif}
.btn{background:var(--dark);border:1px solid var(--dark);border-radius:1px;color:#fff;padding:10px 16px;font-size:12px}
.btn.ghost{background:white;color:var(--dark);border:1px solid var(--bd)}
.btn.sm{padding:7px 10px;font-size:11px}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow:auto}
.tabs .on{background:#ebd4ee!important;color:var(--dark)!important;border-color:#e1c0e9!important}
.panel{border:1px solid var(--bd);background:white;border-radius:3px;padding:18px;margin-bottom:13px}
#app>.panel{max-width:980px;padding:24px 35px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.scroll{overflow-x:auto}
.msg{padding:13px;background:#fff;border:1px solid var(--bd)}
@media(max-width:1000px){.desktop-nav{display:none}.hero-copy{padding-left:45px}.hero h1{font-size:64px}.hero-circle{min-height:280px;min-width:280px}.collection-grid{gap:15px}.collection-photo{height:210px}.collection-info{padding:18px}.collection-info h3{font-size:24px}}

 .announcement{font-size:9px;padding:7px 7px}

 .hero h1{font-size:clamp(52px,13.9vw,75px);margin:0 0 16px;line-height:.99}
 .hero-copy p{font-size:12px;max-width:290px;line-height:1.75;margin-bottom:20px}
 .dark-btn{font-size:9px;padding:12px 15px;gap:20px;min-height:42px}
 .hero-art{min-height:330px;max-height:330px}
 .hero-circle{width:266px;height:266px;min-width:0;min-height:0;box-shadow:0 8px 38px #7d568338}
 .hero-circle img{width:119px;height:119px}
 .little-stars{top:34px;font-size:27px}
 .circle-caption{font-size:16px;padding-top:13px}
 .orbit{width:400px;height:400px;top:-20px;right:-70px}
 .orbit-two{width:310px;height:310px;top:20px;right:-30px}
 .hero-sticker{border-radius:17px}
 .sticker-flower{width:75px;height:74px;left:5%;top:21px;font-size:55px}
 .sticker-bow{width:68px;height:70px;top:11px;right:7%;font-size:36px}
 .sticker-gift{width:67px;height:67px;left:9%;bottom:17px;font-size:39px}
 .sticker-sparkle{font-size:46px;right:6%;bottom:22px}

<style id="adminStyles" media="not all">
:root{--bg:#fff9fc;--card:#fff;--ink:#2b2432;--soft:#8e8091;--accent:#a259d9;--line:#eadde9;--shadow:0 18px 60px #53336215}
*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'DM Sans',Arial,sans-serif}
a{color:inherit}button,input,textarea,select{font:inherit}button{cursor:pointer}h1,h2,h3{font-family:'Playfair Display',Georgia,serif}
.admin-top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
.admin-top-inner{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 22px}
.brandlock{display:flex;align-items:center;gap:12px;text-decoration:none}.brandlock img{height:42px;width:42px;border-radius:50%;object-fit:contain}
.brandlock strong{font:700 23px 'Playfair Display',serif;letter-spacing:-.4px}.back{font-size:12px;text-decoration:none;border:1px solid var(--line);padding:9px 12px;background:#fff}
.kicker{font-size:10px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;color:#9a659f}
main{max-width:1040px;margin:40px auto;padding:0 22px 70px;min-height:60vh}main>h2{font-size:36px;margin:0 0 18px}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:24px;margin-bottom:16px;box-shadow:0 4px 30px #36213808}
.panel b{font-weight:700}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:10px 15px;font-size:12px;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.tabs .on{background:#ead1ec!important;border-color:#d9b6df!important;color:#39233b!important}.btn.sm{padding:6px 10px;font-size:11px}
label{display:block;font-size:12px;font-weight:600;margin:15px 0 5px}input,select,textarea{background:#fff;border:1px solid #ded3de;padding:11px 12px;border-radius:4px;width:100%;max-width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #a259d91b}input[type=checkbox]{width:auto;margin-right:6px}input[type=file]{padding:7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row select{width:auto}.mu{font-size:12px;color:var(--soft)}.badge{display:inline-block;border-radius:100px;background:#f0e1f1;padding:2px 9px;font-size:11px}
.scroll{overflow-x:auto}.scroll table{min-width:420px}.notice{background:#f8ecf6;border:1px solid #e8cbe4;padding:13px 15px;font-size:12px;border-radius:5px;margin-bottom:20px}
.login-panel{max-width:440px;margin:8vh auto;box-shadow:var(--shadow)}.login-panel h2{font-size:32px;margin:6px 0 8px}.login-panel p{color:var(--soft)}.login-panel .btn{width:100%;margin-top:18px;padding:13px}
.foot{text-align:center;color:var(--soft);font-size:11px;padding:22px;border-top:1px solid var(--line)}
@media(max-width:600px){main{margin:24px auto;padding:0 15px 50px}main>h2{font-size:29px}.panel{padding:16px}.admin-top-inner{padding:10px 15px}.brandlock strong{font-size:20px}.brandlock img{width:34px;height:34px}.back{font-size:10px}}
</style>

function renderCart(){
 var ids=Object.keys(cart).filter(function(k){return products.some(function(p){return p.id===k})&&cart[k]>0});
 var total=0,h='<div class="cart-head"><div><div class="eyebrow">JUST FOR YOU</div><h2>Shopping bag <em>♡</em></h2></div><button class="icon-btn" aria-label="Close cart" onclick="toggleCart(false)">✕</button></div>';
 if(!ids.length){h+='<div class="cart-empty"><div>♡</div><h3>Your bag is waiting</h3><p>Find something lovely to make your day.</p><button class="dark-btn" onclick="toggleCart(false);location.hash=\'shop\'">KEEP SHOPPING ↗</button></div>';$('cart').innerHTML=h;return}
 ids.forEach(function(id){var p=products.find(function(x){return x.id===id});var q=cart[id];total+=p.price*q;
 h+='<div class="cart-line">'+(p.image?'<img src="'+esc(p.image)+'" alt="">':'<div class="cart-img-placeholder">✿</div>')+'<div class="cart-line-info"><b>'+esc(p.name)+'</b><span>'+money(p.price)+'</span><div class="quantity"><button aria-label="Decrease quantity" onclick="qty(\''+esc(id)+'\',-1)">−</button><span>'+q+'</span><button aria-label="Increase quantity" onclick="qty(\''+esc(id)+'\',1)">+</button></div></div></div>'});
 h+='<div class="cart-total"><span>Subtotal</span><b>'+money(total)+'</b></div><p class="cart-delivery">🚚 Delivery all over Pakistan • Cash on delivery available</p>'+
 '<label for="cn">Full name</label><input id="cn" autocomplete="name" value="'+esc(cartDraft.name)+'" placeholder="Your full name"><label for="cp">Phone number</label><input id="cp" type="tel" autocomplete="tel" value="'+esc(cartDraft.phone)+'" placeholder="03XX XXXXXXX"><label for="ca">Delivery address</label><textarea id="ca" rows="3" placeholder="House, street, city">'+esc(cartDraft.address)+'</textarea><label for="cx">Order notes (optional)</label><input id="cx" value="'+esc(cartDraft.note)+'" placeholder="Anything we should know?">'+
 '<p id="cerr" class="mu"></p><button class="dark-btn checkout-button" onclick="checkout()">PLACE MY ORDER ↗</button>';
 $('cart').innerHTML=h;
}
function qty(id,d){captureCartDraft();cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()}
async function checkout(){
  captureCartDraft();
  var n=cartDraft.name.trim(),p=cartDraft.phone.trim(),a=cartDraft.address.trim();
  if(!n||!p||!a){$('cerr').textContent='Please fill in your name, phone and address.';return}
  if(!db){$('cerr').textContent='The store is offline. Please try again when the connection is restored.';return}
  var items=[],total=0;
  Object.keys(cart).forEach(function(id){var pr=products.find(function(x){return x.id===id});if(pr){items.push({id:id,name:pr.name,price:pr.price,qty:cart[id]});total+=pr.price*cart[id]}});
  if(!items.length){$('cerr').textContent='Add a product to your bag first.';return}
  var oid=String(Date.now()).slice(-6);
  try{
    await db.collection('orders').add({number:oid,name:n,phone:p,address:a,note:cartDraft.note,items:items,total:total,status:'new',created:Date.now()});
    cart={};cartDraft={name:'',phone:'',address:'',note:''};placed=oid;toggleCart(false);location.hash='shop';render();window.scrollTo(0,0);
  }catch(e){$('cerr').textContent='Could not place your order. Please try again.'}
}
/* Boutique experience helpers — storefront controls */
var showFavorites=false;
var wishlist=[];
try{wishlist=JSON.parse(localStorage.getItem('artiistWishlist')||'[]')}catch(e){}
var cartDraft={name:'',phone:'',address:'',note:''};
function captureCartDraft(){
 if($('cn'))cartDraft={name:$('cn').value,phone:$('cp').value,address:$('ca').value,note:$('cx').value};
}
function toggleFavorite(id){
 var i=wishlist.indexOf(id);
 if(i>=0)wishlist.splice(i,1);else wishlist.push(id);
 try{localStorage.setItem('artiistWishlist',JSON.stringify(wishlist))}catch(e){}
 render();
}
function toggleFavorites(){
 showFavorites=!showFavorites;cat='All';query='';if($('q'))$('q').value='';
 if(route()!=='shop')location.hash='shop';else render();
 setTimeout(function(){var e=$('products');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},50);
}
function setCat(c){cat=c;showFavorites=false;render();var e=$('products');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
function showAllProducts(event){if(event)event.preventDefault();query='';if($('q'))$('q').value='';if(route()!=='shop')location.hash='shop';setCat('All');}
function resetFilters(){cat='All';query='';showFavorites=false;if($('q'))$('q').value='';render()}
function selectCollection(event,c){if(event)event.preventDefault();if(route()!=='shop')location.hash='shop';setCat(c)}
function scrollToProducts(event){event.preventDefault();if(route()!=='shop')location.hash='shop';setTimeout(function(){var e=$('products');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},30)}
function toggleSearch(){
 var el=$('searchPanel');el.classList.toggle('visible');$('searchBtn').setAttribute('aria-expanded',el.classList.contains('visible'));
 if(el.classList.contains('visible'))$('q').focus();
}
function searchStore(val){query=val;if(route()!=='shop')location.hash='shop';else render();if(val.trim()){var e=$('products');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}}
function toggleMenu(open){
 var show=open===true?true:open===false?false:!$('menuDrawer').classList.contains('open');
 $('menuDrawer').classList.toggle('open',show);$('menuOverlay').classList.toggle('shown',show);
 document.body.classList.toggle('menu-open',show);
}
function menuTo(c){toggleMenu(false);cat=c;showFavorites=false;query='';if($('q'))$('q').value='';location.hash='shop';render();if(c!=='All'){var e=$('products');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}}
window.addEventListener('keydown',function(e){if(e.key==='Escape'){toggleCart(false);toggleMenu(false);$('searchPanel').classList.remove('visible')}});


/* Export only the page actions used by inline controls. */
window.esc = esc;
window.money = money;
window.applyBrand = applyBrand;
window.route = route;
window.render = render;
window.normalizeCategory = normalizeCategory;
window.disc = disc;
window.renderShop = renderShop;
window.renderItem = renderItem;
window.addCart = addCart;
window.toggleCart = toggleCart;
window.renderCart = renderCart;
window.qty = qty;
window.checkout = checkout;
window.captureCartDraft = captureCartDraft;
window.toggleFavorite = toggleFavorite;
window.toggleFavorites = toggleFavorites;
window.setCat = setCat;
window.showAllProducts = showAllProducts;
window.resetFilters = resetFilters;
window.selectCollection = selectCollection;
window.scrollToProducts = scrollToProducts;
window.toggleSearch = toggleSearch;
window.searchStore = searchStore;
window.toggleMenu = toggleMenu;
window.menuTo = menuTo;

/* ---------- public storefront boot ---------- */
if(typeof firebase==='undefined') {ready=true;failed=true;render();} else {
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  window.addEventListener('hashchange',render);
  render();
  setTimeout(function(){if(!ready){failed=true;render()}},10000);
  db.collection('products').onSnapshot(function(s){
    products=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return (b.created||0)-(a.created||0)});
    ready=true;failed=false;render();
  },function(){failed=true;render()});
  db.collection('settings').doc('brand').onSnapshot(function(s){if(s.exists)brand=Object.assign(brand,s.data());render()},function(e){console.warn('Brand settings unavailable',e)});
}
 })();
}
</script>
