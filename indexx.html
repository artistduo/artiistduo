<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artiist Duo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6ff;--card:#fff;--tx:#2a1f33;--mu:#7d6b8a;--bd:#efd9f7;--ac:#a259d9;--ac-tx:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18121d;--card:#241b2c;--tx:#f3efe9;--mu:#a29b90;--bd:#3a2c46;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18121d;--card:#241b2c;--tx:#f3efe9;--mu:#a29b90;--bd:#3a2c46;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{font-size:22px;font-weight:700;letter-spacing:.3px;cursor:pointer}
.tag{color:var(--mu);font-size:13px;font-family:system-ui,sans-serif}
nav{display:flex;gap:8px;font-family:system-ui,sans-serif}
.btn{background:var(--ac);color:var(--ac-tx);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-family:system-ui,sans-serif;font-size:14px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:5px 9px;font-size:12px}
main{max-width:1000px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.card .im{aspect-ratio:1;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:48px}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .b{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pr{font-weight:700;color:var(--ac)}
.mu{color:var(--mu);font-size:14px}
.sans{font-family:system-ui,sans-serif}
h2{margin:8px 0 16px}
label{display:block;font:600 13px system-ui,sans-serif;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:16px;font-family:system-ui,sans-serif}
.tabs .btn.on{background:var(--ac);color:var(--ac-tx)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.scroll{overflow-x:auto}
.cart{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);background:var(--bg);border-left:1px solid var(--bd);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:20;transform:translateX(100%);transition:transform .2s}
.cart.open{transform:none}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);font-family:system-ui,sans-serif}
.msg{padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--bd);font-family:system-ui,sans-serif;font-size:14px;margin-bottom:12px}
.srch{flex:1;max-width:520px;min-width:120px;border-radius:999px;padding:10px 16px}
header{flex-wrap:wrap}
.hero{background:linear-gradient(120deg,#efcdfb,#f9b8d6);color:#4a2a63;border-radius:14px;padding:28px 22px;margin-bottom:16px;font-family:system-ui,sans-serif}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;opacity:.95}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;font-family:system-ui,sans-serif}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.perks{display:flex;gap:16px;flex-wrap:wrap;font:13px system-ui,sans-serif;color:var(--mu);margin-bottom:16px}
.off{position:absolute;top:8px;right:8px;background:#e53935;color:#fff;font:700 12px system-ui,sans-serif;padding:3px 8px;border-radius:6px}
.card{cursor:pointer;position:relative}
.old{text-decoration:line-through;color:var(--mu);font-size:13px;margin-left:6px;font-weight:400}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.detail .im2{aspect-ratio:1;background:var(--bd);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:90px;overflow:hidden}
.detail .im2 img{width:100%;height:100%;object-fit:cover}
.logo{width:46px;height:46px;border-radius:50%;flex:none}.brand{font-family:'Playfair Display',Georgia,serif}
.foot{max-width:1000px;margin:24px auto 0;padding:20px;border-top:1px solid var(--bd);font:14px/1.7 system-ui,sans-serif;color:var(--mu)}.foot a{color:var(--ac)}
</style></head>

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return esc(brand.currency)+' '+Number(n||0).toLocaleString()}
function applyBrand(){
  $('bn').textContent=brand.name;$('bt').textContent=brand.tagline||'';document.title=brand.name;
  document.documentElement.style.setProperty('--ac',brand.color||'#b5532b');
}
function route(){return (location.hash||'#shop').slice(1)}
function render(){
  applyBrand();
  $('adminBtn').style.display=isAdmin?'':'none';
  var n=Object.keys(cart).reduce(function(a,k){return a+cart[k]},0);
  $('cartBtn').textContent='Cart ('+n+')';
  if(failed){$('app').innerHTML='<div class="msg">The store data could not be loaded. Please check your internet connection and reload the page.</div>';return}
  if(!ready){return}
  if(route()==='admin'){isAdmin?renderAdmin():renderLogin()}

}
function disc(p){return p.oldPrice&&p.oldPrice>p.price?Math.round((1-p.price/p.oldPrice)*100):0}
function renderShop(){
  var all=products.filter(function(p){return p.active!==false});
  var cats=['All'].concat(all.map(function(p){return p.category||'General'}).filter(function(c,i,a){return a.indexOf(c)===i}));
  var qq=query.trim().toLowerCase();
  var list=all.filter(function(p){return (cat==='All'||(p.category||'General')===cat)&&(!qq||(p.name+' '+(p.description||'')).toLowerCase().indexOf(qq)>-1)});
  var h='';
  if(placed){h+='<div class="msg">Thank you! Your order <b>#'+esc(placed)+'</b> was received. We will contact you soon.</div>'}
  h+='<div class="hero"><h1>'+esc(brand.name)+'</h1><p>'+esc(brand.tagline)+'</p></div>';
  h+='<div class="perks"><span>🚚 Delivery all over Pakistan</span><span>💵 Cash on delivery</span><span>✅ Handmade & gift picks</span></div>';
  h+='<div class="chips">'+cats.map(function(c){return '<span class="chip '+(c===cat?'on':'')+'" onclick="cat=this.dataset.c;render()" data-c="'+esc(c)+'">'+esc(c)+'</span>'}).join('')+'</div>';
  if(!list.length){h+='<p class="mu">'+(all.length?'No products match your search.':'No products yet — check back soon.')+'</p>'}
  h+='<div class="grid">'+list.map(function(p){
    var out=p.stock!=null&&p.stock!==''&&Number(p.stock)<=0,d=disc(p);
    return '<div class="card" onclick="location.hash=\'item-'+p.id+'\'">'+(d?'<span class="off">-'+d+'%</span>':'')+'<div class="im">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'🛍️')+'</div><div class="b"><div><b>'+esc(p.name)+'</b></div><div class="pr">'+money(p.price)+(d?'<span class="old">'+money(p.oldPrice)+'</span>':'')+'</div>'+(out?'<span class="badge">Out of stock</span>':'<button class="btn" onclick="event.stopPropagation();addCart(\''+p.id+'\')">Add to cart</button>')+'</div></div>'}).join('')+'</div>';
  $('app').innerHTML=h;
}
function renderItem(id){
  var p=products.find(function(x){return x.id===id});
  if(!p){$('app').innerHTML='<p class="mu">Product not found. <a href="#shop">Back to store</a></p>';return}
  var out=p.stock!=null&&p.stock!==''&&Number(p.stock)<=0,d=disc(p);
  $('app').innerHTML='<p class="sans"><a href="#shop" style="color:var(--ac)">← Back to store</a></p><div class="detail"><div class="im2">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'🛍️')+'</div><div><span class="badge">'+esc(p.category||'General')+'</span><h2 style="margin-top:10px">'+esc(p.name)+'</h2><div class="pr" style="font-size:26px">'+money(p.price)+(d?'<span class="old">'+money(p.oldPrice)+'</span> <span class="badge" style="color:#e53935">-'+d+'%</span>':'')+'</div><p class="mu sans">'+(out?'Out of stock':(p.stock!==''&&p.stock!=null?p.stock+' in stock':'In stock'))+'</p><h3 class="sans" style="margin-bottom:4px">Product details</h3><p style="white-space:pre-wrap">'+esc(p.description||'No details provided.')+'</p>'+(out?'':'<button class="btn" onclick="addCart(\''+p.id+'\')">Add to cart</button>')+'</div></div>';
  window.scrollTo(0,0);
}
function addCart(id){cart[id]=(cart[id]||0)+1;placed=null;render();toggleCart(true)}
function toggleCart(f){$('cart').classList.toggle('open',f===true?true:undefined)}
function renderCart(){
  var ids=Object.keys(cart).filter(function(k){return products.some(function(p){return p.id===k})});
  var total=0,h='<div class="row" style="justify-content:space-between"><h2 style="margin:0">Your cart</h2><button class="btn ghost sm" onclick="toggleCart(false)">Close</button></div>';
  if(!ids.length){h+='<p class="mu">Your cart is empty.</p>';$('cart').innerHTML=h;return}
  ids.forEach(function(id){var p=products.find(function(x){return x.id===id});var q=cart[id];total+=p.price*q;
    h+='<div class="panel"><b>'+esc(p.name)+'</b><div class="row sans" style="justify-content:space-between;margin-top:6px"><span>'+money(p.price)+' × '+q+'</span><span><button class="btn ghost sm" onclick="qty(\''+id+'\',-1)">−</button> <button class="btn ghost sm" onclick="qty(\''+id+'\',1)">+</button></span></div></div>'});
  h+='<p class="sans"><b>Total: '+money(total)+'</b></p>'+
  '<label>Your name</label><input id="cn"><label>Phone</label><input id="cp" type="tel"><label>Delivery address</label><textarea id="ca" rows="3"></textarea><label>Notes (optional)</label><input id="cx">'+
  '<p id="cerr" class="mu"></p><button class="btn" style="width:100%" onclick="checkout()">Place order</button>';
  $('cart').innerHTML=h;
}
function qty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()}
async function checkout(){
  var n=$('cn').value.trim(),p=$('cp').value.trim(),a=$('ca').value.trim();
  if(!n||!p||!a){$('cerr').textContent='Please fill in name, phone and address.';return}
  var items=[],total=0;
  Object.keys(cart).forEach(function(id){var pr=products.find(function(x){return x.id===id});if(pr){items.push({id:id,name:pr.name,price:pr.price,qty:cart[id]});total+=pr.price*cart[id]}});
  var oid=String(Date.now()).slice(-6);
  try{
    await db.collection('orders').add({number:oid,name:n,phone:p,address:a,note:$('cx').value.trim(),items:items,total:total,status:'new',created:Date.now()});
    cart={};placed=oid;toggleCart(false);render();window.scrollTo(0,0);
  }catch(e){$('cerr').textContent='Could not place the order. Please try again.'}
}

}
async function saveProduct(id){
  var name=$('pn').value.trim(),price=parseFloat($('pp').value);
  if(!name||isNaN(price)){$('perr').textContent='Name and price are required.';return}
  var old=products.find(function(x){return x.id===id})||{};
  var data={name:name,price:price,oldPrice:$('po').value===''?'':Number($('po').value),category:$('pc').value.trim()||'General',description:$('pd').value.trim(),stock:$('ps').value===''?'':Number($('ps').value),active:$('pa').checked,image:old.image||'',created:old.created||Date.now()};
  try{
    var f=$('pf')&&$('pf').files[0];
    if(f&&assets){$('perr').textContent='Uploading photo…';data.image=await shrink(f)}
    await db.collection('products').doc(id||('p'+Date.now())).set(data);
    editing=null;render();
  }catch(e){$('perr').textContent='Could not save: '+(e&&e.message||'error')}
}
async function delProduct(id){if(confirm('Delete this product?'))try{await db.collection('products').doc(id).delete()}catch(e){alert('Could not delete')}}
function adminOrders(){
  if(!orders.length)return '<p class="mu">No orders yet.</p>';
  return orders.map(function(o){return '<div class="panel"><div class="row" style="justify-content:space-between"><b>Order #'+esc(o.number)+'</b><span class="mu">'+new Date(o.created).toLocaleString()+'</span></div>'+
  '<div class="sans" style="margin:8px 0"><b>'+esc(o.name)+'</b> · '+esc(o.phone)+'<br>'+esc(o.address)+(o.note?'<br><i>'+esc(o.note)+'</i>':'')+'</div>'+
  '<div class="scroll"><table class="sans" style="width:100%;font-size:14px;border-collapse:collapse">'+(o.items||[]).map(function(i){return '<tr><td>'+esc(i.name)+'</td><td>× '+i.qty+'</td><td style="text-align:right">'+money(i.price*i.qty)+'</td></tr>'}).join('')+'</table></div>'+
  '<p class="sans"><b>Total: '+money(o.total)+'</b></p><div class="row"><select style="width:auto" onchange="setStatus(\''+o.id+'\',this.value)">'+['new','confirmed','shipped','delivered','cancelled'].map(function(s){return '<option '+(o.status===s?'selected':'')+'>'+s+'</option>'}).join('')+'</select><button class="btn ghost sm" onclick="delOrder(\''+o.id+'\')">Delete</button></div></div>'}).join('');
}
async function setStatus(id,v){try{await db.collection('orders').doc(id).update({status:v})}catch(e){alert('Could not update')}}
async function delOrder(id){if(confirm('Delete this order?'))try{await db.collection('orders').doc(id).delete()}catch(e){alert('Could not delete')}}
function adminBrand(){
  return '<div class="panel"><b>Your branding</b><label>Store name</label><input id="bn1" value="'+esc(brand.name)+'"><label>Tagline</label><input id="bt1" value="'+esc(brand.tagline)+'"><label>Brand colour</label><input id="bc1" type="color" value="'+esc(brand.color)+'" style="height:42px"><label>Currency label</label><input id="bu1" value="'+esc(brand.currency)+'"><p id="berr" class="mu"></p><button class="btn" onclick="saveBrand()">Save branding</button></div>';
}
async function saveBrand(){
  try{await db.collection('settings').doc('brand').set({name:$('bn1').value.trim()||'My Store',tagline:$('bt1').value.trim(),color:$('bc1').value,currency:$('bu1').value.trim()||'Rs'});$('berr').textContent='Saved.'}
  catch(e){$('berr').textContent='Could not save.'}
}
/* ---------- boot ---------- */
firebase.initializeApp(firebaseConfig);
db=firebase.firestore();var auth=firebase.auth();
function shrink(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function renderLogin(){$('app').innerHTML='<div class="panel" style="max-width:380px;margin:20px auto"><b>Admin login</b><label>Email</label><input id="le" type="email"><label>Password</label><input id="lp" type="password"><p id="lerr" class="mu"></p><button class="btn" onclick="login()">Log in</button></div>'}
async function login(){try{await auth.signInWithEmailAndPassword($('le').value.trim(),$('lp').value)}catch(e){$('lerr').textContent='Wrong email or password.'}}
window.addEventListener('hashchange',render);
render();
setTimeout(function(){if(!ready){failed=true;render()}},10000);
var unsubOrders=null;
auth.onAuthStateChanged(function(u){
  isAdmin=!!(u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase());
  if(unsubOrders){unsubOrders();unsubOrders=null}
  if(isAdmin)unsubOrders=db.collection('orders').onSnapshot(function(s){orders=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return (b.created||0)-(a.created||0)});render()});
  render();
});
db.collection('products').onSnapshot(function(s){products=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return (b.created||0)-(a.created||0)});ready=true;render()},function(){failed=true;render()});
db.collection('settings').doc('brand').onSnapshot(function(s){if(s.exists)brand=Object.assign(brand,s.data());render()});
</script>
